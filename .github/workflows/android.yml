# Jarvis para Android: en cada cambio pasa las pruebas (lógica y de punta a punta en un celular simulado), compila el APK
# y lo deja para descargar en la pestaña Actions. Si se subió la versión en package.json, publica la Release vX.Y con el APK.
name: Jarvis para Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 3.29: los motores del celular (GGUF con llama.cpp, dictado con whisper.cpp y voz neural Supertonic) se prueban en el
  # computador con modelos de verdad: una pregunta en español, una frase hablada y el dictado de esa misma frase.
  motores:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Modelos de prueba (en caché)
        uses: actions/cache@v4
        with:
          path: ~/modelos
          key: modelos-329-qwen3-0.6b-whisper-base-supertonic3

      - name: Bajar los modelos
        run: |
          mkdir -p ~/modelos/supertonic/onnx ~/modelos/supertonic/voice_styles
          cd ~/modelos
          HF=https://huggingface.co
          [ -s qwen.gguf ] || curl -fsSL -o qwen.gguf "$HF/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
          [ -s whisper.bin ] || curl -fsSL -o whisper.bin "$HF/ggerganov/whisper.cpp/resolve/main/ggml-base-q8_0.bin"
          ST=$HF/supertone-oss-archive/supertonic-3/resolve/aafc6e32416a594460b32413efc49d7fe4ce6d46
          for f in duration_predictor.onnx text_encoder.onnx vector_estimator.onnx vocoder.onnx tts.json unicode_indexer.json; do
            [ -s supertonic/onnx/$f ] || curl -fsSL -o supertonic/onnx/$f "$ST/onnx/$f"
          done
          for v in M1 F1; do [ -s supertonic/voice_styles/$v.json ] || curl -fsSL -o supertonic/voice_styles/$v.json "$ST/voice_styles/$v.json"; done
          ls -la . supertonic/onnx supertonic/voice_styles

      - name: Compilar los motores (llama.cpp y whisper.cpp)
        run: |
          sudo apt-get install -y -qq ninja-build > /dev/null
          git clone -q --depth 1 --branch b12634 https://github.com/ggml-org/llama.cpp ../llama.cpp
          git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp ../whisper.cpp
          cmake -S android/motor-llama/src/main/cpp -B ../bl -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR=$PWD/../llama.cpp
          cmake -S android/motor-whisper/src/main/cpp -B ../bw -G Ninja -DCMAKE_BUILD_TYPE=Release -DWHISPER_DIR=$PWD/../whisper.cpp
          ninja -C ../bl jarvis_llama
          ninja -C ../bw jarvis_whisper

      - name: Probar los tres motores
        run: |
          mkdir -p ../jars && cd ../jars
          M=https://repo1.maven.org/maven2
          ov=$(curl -fsSL $M/com/microsoft/onnxruntime/onnxruntime/maven-metadata.xml | grep -o '<release>[^<]*' | cut -d'>' -f2)
          jv=$(curl -fsSL $M/org/json/json/maven-metadata.xml | grep -o '<release>[^<]*' | cut -d'>' -f2)
          echo "onnxruntime $ov · org.json $jv"
          curl -fsSL -o ort.jar $M/com/microsoft/onnxruntime/onnxruntime/$ov/onnxruntime-$ov.jar
          curl -fsSL -o json.jar $M/org/json/json/$jv/json-$jv.jar
          cd -
          mkdir -p ../clases
          javac -d ../clases -cp ../jars/ort.jar:../jars/json.jar \
            android/motor-llama/src/main/java/co/jarvis/motores/Llama.java \
            android/motor-whisper/src/main/java/co/jarvis/motores/Whisper.java \
            android/app/src/main/java/co/jarvis/docente/supertonic/*.java \
            pruebas/motores/PruebaMotores.java
          java -cp ../clases:../jars/ort.jar:../jars/json.jar PruebaMotores \
            $PWD/../bl/libjarvis_llama.so ~/modelos/qwen.gguf $PWD/../bw/libjarvis_whisper.so ~/modelos/whisper.bin ~/modelos/supertonic

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Los equipos de GitHub (ubuntu) ya traen el SDK de Android con las licencias aceptadas; Gradle baja lo que falte.
      - name: SDK de Android
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Instalar
        run: npm ci

      - name: Pruebas de la lógica
        run: node --test pruebas/logica.test.js pruebas/logica2.test.js pruebas/logica3.test.js pruebas/logica4.test.js pruebas/logica5.test.js pruebas/logica6.test.js pruebas/logica7.test.js pruebas/logica8.test.js pruebas/logica9.test.js pruebas/logica10.test.js pruebas/logica11.test.js pruebas/logica12.test.js pruebas/logica13.test.js pruebas/logica14.test.js pruebas/logica16.test.js pruebas/logica17.test.js pruebas/logica18.test.js

      - name: Prueba de punta a punta (celular simulado)
        run: |
          python3 -m pip install --quiet playwright pillow openpyxl
          python3 -m playwright install --with-deps chromium
          python3 pruebas/e2e.py capturas
          python3 pruebas/nativo_sim.py
          python3 pruebas/e2e34.py
          python3 pruebas/e2e36.py
          python3 pruebas/e2e37.py
          python3 pruebas/e2e38.py
          python3 pruebas/e2e39.py
          python3 pruebas/e2e310.py
          python3 pruebas/e2e311.py
          python3 pruebas/e2e312.py
          python3 pruebas/e2e314.py
          python3 pruebas/e2e316.py
          python3 pruebas/e2e317.py
          python3 pruebas/e2e318.py
          python3 pruebas/e2e319.py
          python3 pruebas/e2e321.py
          python3 pruebas/e2e323.py
          python3 pruebas/e2e326.py
          python3 pruebas/e2e328.py
          python3 pruebas/e2e329.py

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: capturas-android
          path: capturas
          if-no-files-found: ignore

      - name: Versión
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compilar el APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../salida
          cp app/build/outputs/apk/debug/app-debug.apk "../salida/Jarvis-android-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Jarvis-android-${{ steps.ver.outputs.version }}
          path: salida/*.apk

      - name: Publicar la Release (solo si la versión es nueva)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then echo "La Release $tag ya existe: no la toco."; exit 0; fi
          gh release create "$tag" "salida/Jarvis-android-$v.apk" --target "${{ github.sha }}" --title "Jarvis para Android $v" --notes-file NOTAS.md --latest

  # Opcional: la misma app como página web instalable (Chrome › «Agregar a la pantalla principal»), en GitHub Pages.
  # Se activa creando la variable del repositorio JARVIS_PAGINA = 1 (Settings › Secrets and variables › Actions › Variables)
  # y escogiendo «GitHub Actions» como fuente en Settings › Pages.
  pagina:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JARVIS_PAGINA == '1'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
