apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    packagingOptions { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
    namespace = "co.jarvis.docente"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.jarvis.docente"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 25
        versionName "3.14.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // solo los procesadores de los celulares Android (el motor de voz pesa ~10 MB por cada uno)
        ndk { abiFilters 'arm64-v8a' }   // 3.14: solo celulares de 64 bits (Gemma solo corre en ellos): APK mucho más liviano
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Jarvis: una firma fija (la misma en cada compilación), para que el APK se actualice encima del anterior y para
    // registrar su huella SHA-1 en Google Cloud (inicio de sesión con Google). Es una llave de prueba, no de Play Store.
    signingConfigs {
        jarvis {
            storeFile file('jarvis.keystore')
            storePassword 'jarvis-docente'
            keyAlias 'jarvis'
            keyPassword 'jarvis-docente'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    buildTypes {
        debug {
            signingConfig signingConfigs.jarvis
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 2.2: reconocimiento de voz sin internet para «Jarvis» en segundo plano (el mismo motor del Jarvis del computador)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // 3.2: la IA dentro del celular (MediaPipe LLM Inference)
    implementation 'com.google.mediapipe:tasks-genai:0.10.24'
    // 3.4: huella o PIN, escáner de documentos y lectura de texto sin internet
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'   // 3.14: el modelo lo pone Google Play (APK más liviano)
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    // 3.12: Gemma 4 en el celular (LiteRT-LM de Google)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'
    // 3.6: recordatorios por lugar
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
